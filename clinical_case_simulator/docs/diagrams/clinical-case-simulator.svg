<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1105" width="2520" height="2210"><style>
 .box{fill:#EDEFF1;stroke:#14171A;stroke-width:1.3}
 .box-flow{fill:#E7F1EE;stroke:#1F6F5C;stroke-width:1.7}
 .box-gate{fill:#F7EBEC;stroke:#A32B3C;stroke-width:1.9}
 .box-open{fill:none;stroke:#C4CAD1;stroke-width:1.2}
 .ln{stroke:#14171A;stroke-width:1.5;fill:none}
 .ln-f{stroke:#1F6F5C;stroke-width:2;fill:none}
 .ln-g{stroke:#A32B3C;stroke-width:2.2;fill:none}
 .ln-no{stroke:#A32B3C;stroke-width:2.2;fill:none;stroke-dasharray:7 5;opacity:.85}
 .xm{stroke:#A32B3C;stroke-width:3.4;stroke-linecap:round}
 .t{fill:#14171A;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16px;font-weight:700}
 .tf{fill:#1F6F5C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16px;font-weight:700}
 .tg{fill:#A32B3C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16px;font-weight:700}
 .s{fill:#5B6570;font-family:DejaVu Sans Mono, Consolas, monospace;font-size:12.5px}
 .sg{fill:#A32B3C;font-family:DejaVu Sans Mono, Consolas, monospace;font-size:12.5px;font-weight:700}
 .zn{fill:#8A929C;font-family:DejaVu Sans Mono, Consolas, monospace;font-size:12px;letter-spacing:1.5px}
 .ttl{fill:#14171A;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:26px;font-weight:700}
 .sub{fill:#5B6570;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:15px}
 .cap{fill:#8A929C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:13.5px}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14171A"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F5C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32B3C"/></marker>
</defs><rect x="0" y="0" width="1260" height="1105" fill="#FFFFFF"/><text class="ttl" x="26" y="42">Clinical Case Simulator — how the agent behaves</text><text class="sub" x="26" y="68">A virtual patient that will not tell you the answer, and marks how you reasoned rather than what you concluded.</text><line x1="26" y1="86" x2="1234" y2="86" stroke="#C4CAD1" stroke-width="1"/><text class="zn" x="26" y="116">1 · WHAT THE STUDENT DOES</text><rect class="box" x="26" y="132" width="158" height="70" rx="3"/><text class="t" x="105.0" y="163" text-anchor="middle">Start case</text><text class="s" x="105.0" y="184" text-anchor="middle">picks difficulty</text><line class="ln" x1="184" y1="167" x2="196" y2="167" marker-end="url(#a)"/><rect class="box" x="199" y="132" width="158" height="70" rx="3"/><text class="t" x="278.0" y="163" text-anchor="middle">History</text><text class="s" x="278.0" y="184" text-anchor="middle">asks the patient</text><line class="ln" x1="357" y1="167" x2="369" y2="167" marker-end="url(#a)"/><rect class="box" x="372" y="132" width="158" height="70" rx="3"/><text class="t" x="451.0" y="163" text-anchor="middle">Examination</text><text class="s" x="451.0" y="184" text-anchor="middle">requests findings</text><line class="ln" x1="530" y1="167" x2="542" y2="167" marker-end="url(#a)"/><rect class="box" x="545" y="132" width="158" height="70" rx="3"/><text class="t" x="624.0" y="163" text-anchor="middle">Investigations</text><text class="s" x="624.0" y="184" text-anchor="middle">orders tests</text><line class="ln" x1="703" y1="167" x2="715" y2="167" marker-end="url(#a)"/><rect class="box" x="718" y="132" width="158" height="70" rx="3"/><text class="t" x="797.0" y="163" text-anchor="middle">Differential</text><text class="s" x="797.0" y="184" text-anchor="middle">3 dx + reasons</text><line class="ln" x1="876" y1="167" x2="888" y2="167" marker-end="url(#a)"/><rect class="box" x="891" y="132" width="158" height="70" rx="3"/><text class="t" x="970.0" y="163" text-anchor="middle">Final diagnosis</text><text class="s" x="970.0" y="184" text-anchor="middle">commits</text><line class="ln" x1="1049" y1="167" x2="1061" y2="167" marker-end="url(#a)"/><rect class="box-flow" x="1064" y="132" width="158" height="70" rx="3"/><text class="tf" x="1143.0" y="163" text-anchor="middle">Report</text><text class="s" x="1143.0" y="184" text-anchor="middle">scored feedback</text><text class="s" x="26" y="222">the student may move back and forth — order a test, ask another question, examine again</text><text class="zn" x="26" y="272">2 · WHO IS ALLOWED TO KNOW THE DIAGNOSIS</text><rect class="box-open" x="26" y="286" width="1208" height="424" rx="4"/><rect class="box" x="470" y="306" width="320" height="64" rx="3"/><text class="t" x="630" y="333" text-anchor="middle">Student</text><text class="s" x="630" y="353" text-anchor="middle">types in plain language</text><line class="ln" x1="630" y1="370" x2="630" y2="398" marker-end="url(#a)"/><rect class="box-flow" x="404" y="404" width="452" height="76" rx="3"/><text class="tf" x="630" y="434" text-anchor="middle">Simulator agent — the preceptor</text><text class="sg" x="630" y="457" text-anchor="middle">KNOWS NO DIAGNOSIS · learns the case only from tools</text><line class="ln" x1="470" y1="480" x2="300" y2="542" marker-end="url(#a)"/><text class="s" x="318" y="506">ask_patient</text><line class="ln" x1="790" y1="480" x2="960" y2="542" marker-end="url(#a)"/><text class="s" x="828" y="506">examine · order · submit</text><rect class="box" x="60" y="548" width="320" height="88" rx="3"/><text class="t" x="220" y="578" text-anchor="middle">Patient agent</text><text class="s" x="220" y="599" text-anchor="middle">answers only what is asked,</text><text class="s" x="220" y="617" text-anchor="middle">in lay words, never diagnoses</text><rect class="box" x="880" y="548" width="320" height="88" rx="3"/><text class="t" x="1040" y="578" text-anchor="middle">Tools</text><text class="s" x="1040" y="599" text-anchor="middle">return authored findings,</text><text class="s" x="1040" y="617" text-anchor="middle">or refuse — never invent</text><rect class="box-gate" x="404" y="548" width="452" height="140" rx="3"/><text class="tg" x="630" y="576" text-anchor="middle">The case file</text><rect x="420" y="590" width="204" height="82" rx="2" fill="#FFFFFF" stroke="#C4CAD1"/><text class="s" x="522" y="614" text-anchor="middle">patient_view()</text><text class="s" x="522" y="634" text-anchor="middle">lay history only</text><text class="s" x="522" y="654" text-anchor="middle">— safe to expose</text><rect x="636" y="590" width="204" height="82" rx="2" fill="#F7EBEC" stroke="#A32B3C" stroke-width="1.6"/><text class="sg" x="738" y="614" text-anchor="middle">diagnosis</text><text class="sg" x="738" y="634" text-anchor="middle">rubric · hints</text><text class="sg" x="738" y="654" text-anchor="middle">test results</text><line class="ln" x1="404" y1="612" x2="384" y2="612" marker-end="url(#a)"/><line class="ln" x1="856" y1="612" x2="876" y2="612" marker-end="url(#a)"/><path class="ln-no" d="M738,548 L738,494"/><line class="xm" x1="726" y1="533" x2="750" y2="509"/><line class="xm" x1="726" y1="509" x2="750" y2="533"/><text class="sg" x="758" y="527">never</text><text class="s" x="60" y="700">The diagnosis, rubric and hints reach the tools only — never the agent, never the patient.</text><text class="zn" x="26" y="754">3 · HOW THE MARK IS PRODUCED</text><rect class="box" x="26" y="770" width="222" height="96" rx="3"/><text class="t" x="137.0" y="802" text-anchor="middle">Transcript</text><text class="s" x="137.0" y="824" text-anchor="middle">every question,</text><text class="s" x="137.0" y="843" text-anchor="middle">test and reason</text><line class="ln" x1="248" y1="818" x2="276" y2="818" marker-end="url(#a)"/><rect class="box" x="280" y="770" width="222" height="96" rx="3"/><text class="t" x="391.0" y="802" text-anchor="middle">Case rubric</text><text class="s" x="391.0" y="824" text-anchor="middle">weights, critical</text><text class="s" x="391.0" y="843" text-anchor="middle">items, must-excludes</text><line class="ln-g" x1="502" y1="818" x2="530" y2="818" marker-end="url(#ag)"/><rect class="box-gate" x="534" y="770" width="222" height="96" rx="3"/><text class="tg" x="645.0" y="802" text-anchor="middle">scorer.py</text><text class="s" x="645.0" y="824" text-anchor="middle">pure Python</text><text class="s" x="645.0" y="843" text-anchor="middle">same input = same mark</text><line class="ln" x1="756" y1="818" x2="784" y2="818" marker-end="url(#a)"/><rect class="box" x="788" y="770" width="222" height="96" rx="3"/><text class="t" x="899.0" y="802" text-anchor="middle">Scorecard</text><text class="s" x="899.0" y="824" text-anchor="middle">six skills,</text><text class="s" x="899.0" y="843" text-anchor="middle">numbers fixed</text><line class="ln-f" x1="1010" y1="818" x2="1038" y2="818" marker-end="url(#af)"/><rect class="box-flow" x="1042" y="770" width="222" height="96" rx="3"/><text class="tf" x="1153.0" y="802" text-anchor="middle">Evaluator</text><text class="s" x="1153.0" y="824" text-anchor="middle">writes prose around</text><text class="s" x="1153.0" y="843" text-anchor="middle">marks it cannot change</text><text class="sg" x="26" y="894">The model never produces a number. It cannot award a mark the rubric does not support, and cannot be talked into a better grade.</text><line x1="26" y1="926" x2="1234" y2="926" stroke="#C4CAD1" stroke-width="1"/><text class="zn" x="26" y="954">WHERE IT RUNS</text><rect class="box" x="26" y="968" width="282" height="62" rx="3"/><text class="t" x="167.0" y="996" text-anchor="middle">Gemini Enterprise</text><text class="s" x="167.0" y="1016" text-anchor="middle">the student’s front door</text><line class="ln" x1="308" y1="999" x2="330" y2="999" marker-end="url(#a)"/><rect class="box" x="334" y="968" width="282" height="62" rx="3"/><text class="t" x="475.0" y="996" text-anchor="middle">Agent Runtime</text><text class="s" x="475.0" y="1016" text-anchor="middle">the agent itself</text><line class="ln" x1="616" y1="999" x2="638" y2="999" marker-end="url(#a)"/><rect class="box" x="642" y="968" width="282" height="62" rx="3"/><text class="t" x="783.0" y="996" text-anchor="middle">Managed sessions</text><text class="s" x="783.0" y="1016" text-anchor="middle">close the tab, resume later</text><line class="ln" x1="924" y1="999" x2="946" y2="999" marker-end="url(#a)"/><rect class="box" x="950" y="968" width="282" height="62" rx="3"/><text class="t" x="1091.0" y="996" text-anchor="middle">Case bank</text><text class="s" x="1091.0" y="1016" text-anchor="middle">8 cases, JSON, reviewable</text><text class="cap" x="26" y="1068">Internal Medicine · 8 cases · 4 difficulty levels · educational simulation only, not a diagnostic tool</text></svg>