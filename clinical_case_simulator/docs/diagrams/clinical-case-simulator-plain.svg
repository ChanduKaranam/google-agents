<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1120" width="2520" height="2240"><style>
 .box{fill:#EDEFF1;stroke:#14171A;stroke-width:1.3}
 .box-flow{fill:#E7F1EE;stroke:#1F6F5C;stroke-width:1.7}
 .box-gate{fill:#F7EBEC;stroke:#A32B3C;stroke-width:1.9}
 .box-open{fill:none;stroke:#C4CAD1;stroke-width:1.2}
 .ln{stroke:#14171A;stroke-width:1.5;fill:none}
 .ln-f{stroke:#1F6F5C;stroke-width:2;fill:none}
 .ln-no{stroke:#A32B3C;stroke-width:2.2;fill:none;stroke-dasharray:7 5;opacity:.85}
 .xm{stroke:#A32B3C;stroke-width:3.4;stroke-linecap:round}
 .t{fill:#14171A;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16.5px;font-weight:700}
 .tf{fill:#1F6F5C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16.5px;font-weight:700}
 .tg{fill:#A32B3C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:16.5px;font-weight:700}
 .s{fill:#5B6570;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:13.5px}
 .sg{fill:#A32B3C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:13.5px;font-weight:700}
 .zn{fill:#8A929C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:1.4px}
 .ttl{fill:#14171A;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:27px;font-weight:700}
 .sub{fill:#5B6570;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:15.5px}
 .cap{fill:#8A929C;font-family:DejaVu Sans, Verdana, Arial, sans-serif;font-size:13.5px}
</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14171A"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F5C"/></marker>
</defs><rect x="0" y="0" width="1260" height="1120" fill="#FFFFFF"/><text class="ttl" x="26" y="42">How the Clinical Case Simulator works</text><text class="sub" x="26" y="70">A pretend patient who will not tell you what is wrong — and marks how you worked it out, not just what you guessed.</text><line x1="26" y1="88" x2="1234" y2="88" stroke="#C4CAD1" stroke-width="1"/><text class="zn" x="26" y="120">WHAT A STUDENT DOES</text><rect class="box" x="26" y="136" width="162" height="72" rx="3"/><text class="t" x="107.0" y="166" text-anchor="middle" font-size="14.5">Pick a case</text><text class="s" x="107.0" y="188" text-anchor="middle" font-size="12">choose how hard</text><line class="ln" x1="188" y1="172" x2="196" y2="172" marker-end="url(#a)"/><rect class="box" x="199" y="136" width="162" height="72" rx="3"/><text class="t" x="280.0" y="166" text-anchor="middle" font-size="14.5">Ask questions</text><text class="s" x="280.0" y="188" text-anchor="middle" font-size="12">anything you like</text><line class="ln" x1="361" y1="172" x2="369" y2="172" marker-end="url(#a)"/><rect class="box" x="372" y="136" width="162" height="72" rx="3"/><text class="t" x="453.0" y="166" text-anchor="middle" font-size="14.5">Examine them</text><text class="s" x="453.0" y="188" text-anchor="middle" font-size="12">say what to check</text><line class="ln" x1="534" y1="172" x2="542" y2="172" marker-end="url(#a)"/><rect class="box" x="545" y="136" width="162" height="72" rx="3"/><text class="t" x="626.0" y="166" text-anchor="middle" font-size="14.5">Ask for tests</text><text class="s" x="626.0" y="188" text-anchor="middle" font-size="12">the ones you need</text><line class="ln" x1="707" y1="172" x2="715" y2="172" marker-end="url(#a)"/><rect class="box" x="718" y="136" width="162" height="72" rx="3"/><text class="t" x="799.0" y="166" text-anchor="middle" font-size="14.5">List your ideas</text><text class="s" x="799.0" y="188" text-anchor="middle" font-size="12">three, with reasons</text><line class="ln" x1="880" y1="172" x2="888" y2="172" marker-end="url(#a)"/><rect class="box" x="891" y="136" width="162" height="72" rx="3"/><text class="t" x="972.0" y="166" text-anchor="middle" font-size="14.5">Decide</text><text class="s" x="972.0" y="188" text-anchor="middle" font-size="12">commit to one</text><line class="ln" x1="1053" y1="172" x2="1061" y2="172" marker-end="url(#a)"/><rect class="box-flow" x="1064" y="136" width="162" height="72" rx="3"/><text class="tf" x="1145.0" y="166" text-anchor="middle" font-size="14.5">Get marked</text><text class="s" x="1145.0" y="188" text-anchor="middle" font-size="12">and what you missed</text><text class="s" x="26" y="230">You can go back and forth — ask another question, order one more test, examine again.</text><text class="zn" x="26" y="278">WHO IS ALLOWED TO KNOW THE ANSWER</text><rect class="box-open" x="26" y="292" width="1208" height="448" rx="4"/><rect class="box" x="470" y="312" width="320" height="64" rx="3"/><text class="t" x="630" y="339" text-anchor="middle">The student</text><text class="s" x="630" y="360" text-anchor="middle">asks questions in their own words</text><line class="ln" x1="630" y1="376" x2="630" y2="404" marker-end="url(#a)"/><rect class="box-flow" x="404" y="410" width="452" height="78" rx="3"/><text class="tf" x="630" y="440" text-anchor="middle">The tutor</text><text class="sg" x="630" y="464" text-anchor="middle">runs the case — and does not know the answer either</text><line class="ln" x1="470" y1="488" x2="250" y2="548" marker-end="url(#a)"/><text class="s" x="238" y="518">asks the patient</text><line class="ln" x1="790" y1="488" x2="1010" y2="548" marker-end="url(#a)"/><text class="s" x="1000" y="518">asks to examine or test</text><rect class="box" x="40" y="554" width="280" height="92" rx="3"/><text class="t" x="180" y="584" text-anchor="middle">The patient</text><text class="s" x="180" y="606" text-anchor="middle">answers only what is asked,</text><text class="s" x="180" y="625" text-anchor="middle">in everyday words</text><rect class="box" x="940" y="554" width="280" height="92" rx="3"/><text class="t" x="1080" y="584" text-anchor="middle">The results desk</text><text class="s" x="1080" y="606" text-anchor="middle">hands over a finding when</text><text class="s" x="1080" y="625" text-anchor="middle">asked — never invents one</text><rect class="box-gate" x="340" y="554" width="580" height="156" rx="3"/><text class="tg" x="630" y="583" text-anchor="middle">The sealed case notes</text><rect x="356" y="596" width="176" height="98" rx="2" fill="#FFFFFF" stroke="#C4CAD1" stroke-width="1.5"/><text class="s" x="444" y="622" text-anchor="middle">The patient's</text><text class="s" x="444" y="642" text-anchor="middle">own story</text><text class="s" x="444" y="668" text-anchor="middle" font-size="11.5">they can tell you this</text><rect x="544" y="596" width="176" height="98" rx="2" fill="#FFFFFF" stroke="#C4CAD1" stroke-width="1.5"/><text class="s" x="632" y="622" text-anchor="middle">Findings and</text><text class="s" x="632" y="642" text-anchor="middle">test results</text><text class="s" x="632" y="668" text-anchor="middle" font-size="11.5">only when you ask</text><rect x="732" y="596" width="176" height="98" rx="2" fill="#F7EBEC" stroke="#A32B3C" stroke-width="1.5"/><text class="sg" x="820" y="622" text-anchor="middle">The answer and</text><text class="sg" x="820" y="642" text-anchor="middle">the marking</text><text class="s" x="820" y="668" text-anchor="middle" font-size="11.5">sealed until the end</text><line class="ln" x1="340" y1="632" x2="324" y2="632" marker-end="url(#a)"/><line class="ln" x1="920" y1="632" x2="936" y2="632" marker-end="url(#a)"/><path class="ln-no" d="M820,554 L820,500"/><line class="xm" x1="808" y1="539" x2="832" y2="515"/><line class="xm" x1="808" y1="515" x2="832" y2="539"/><text class="sg" x="840" y="533">never</text><text class="s" x="40" y="728">The answer and the marking stay sealed while you work. Ask "is it a heart attack?" and it asks you what makes you think so.</text><text class="zn" x="26" y="784">HOW YOUR MARK IS WORKED OUT</text><rect class="box" x="26" y="800" width="282" height="98" rx="3"/><text class="t" x="167.0" y="832" text-anchor="middle">Everything you</text><text class="s" x="167.0" y="855" text-anchor="middle">said and did</text><line class="ln" x1="308" y1="849" x2="328" y2="849" marker-end="url(#a)"/><rect class="box-gate" x="332" y="800" width="282" height="98" rx="3"/><text class="tg" x="473.0" y="832" text-anchor="middle">The marking rules</text><text class="s" x="473.0" y="855" text-anchor="middle">a doctor wrote,</text><text class="s" x="473.0" y="875" text-anchor="middle">not the computer</text><line class="ln" x1="614" y1="849" x2="634" y2="849" marker-end="url(#a)"/><rect class="box" x="638" y="800" width="282" height="98" rx="3"/><text class="t" x="779.0" y="832" text-anchor="middle">Your six scores</text><text class="s" x="779.0" y="855" text-anchor="middle">worked out by</text><text class="s" x="779.0" y="875" text-anchor="middle">fixed rules</text><line class="ln-f" x1="920" y1="849" x2="940" y2="849" marker-end="url(#af)"/><rect class="box-flow" x="944" y="800" width="282" height="98" rx="3"/><text class="tf" x="1085.0" y="832" text-anchor="middle">Your report</text><text class="s" x="1085.0" y="855" text-anchor="middle">written in plain</text><text class="s" x="1085.0" y="875" text-anchor="middle">words, for you</text><text class="sg" x="26" y="926">The computer works out every mark. The AI only turns those marks into sentences — it cannot change a single one, however nicely you ask.</text><line x1="26" y1="958" x2="1234" y2="958" stroke="#C4CAD1" stroke-width="1"/><text class="zn" x="26" y="986">WHAT KEEPS IT HONEST</text><rect class="box" x="26" y="1000" width="282" height="66" rx="3"/><text class="t" x="167.0" y="1027" text-anchor="middle" font-size="14">It never gives the answer</text><text class="s" x="167.0" y="1048" text-anchor="middle" font-size="11.5">however you ask for it</text><rect class="box" x="332" y="1000" width="282" height="66" rx="3"/><text class="t" x="473.0" y="1027" text-anchor="middle" font-size="14">It never invents a result</text><text class="s" x="473.0" y="1048" text-anchor="middle" font-size="11.5">if it isn't written down, it says so</text><rect class="box" x="638" y="1000" width="282" height="66" rx="3"/><text class="t" x="779.0" y="1027" text-anchor="middle" font-size="14">A doctor wrote the marking</text><text class="s" x="779.0" y="1048" text-anchor="middle" font-size="11.5">the AI just explains it</text><rect class="box" x="944" y="1000" width="282" height="66" rx="3"/><text class="t" x="1085.0" y="1027" text-anchor="middle" font-size="14">Every case is checked</text><text class="s" x="1085.0" y="1048" text-anchor="middle" font-size="11.5">by a doctor, before students use it</text><text class="cap" x="26" y="1100">Eight cases in general medicine, four levels of difficulty · For practice and teaching only — it is not a real patient and gives no real medical advice.</text></svg>